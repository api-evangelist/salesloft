method: derived
source: >-
  Derived from two real sources, in this order of strength:
  (1) the JSON Schema outputSchemas published anonymously at https://mcp.salesloft.com/ and
  saved verbatim to mcp/salesloft-mcp-tools.json — these carry the actual field names, types
  and embedded reference objects for Account, Person, User, Opportunity, Conversation and Team;
  (2) the resource inventory in openapi/ (82 documents, 176 operations), which supplies the
  paths and the entities the MCP surface does not cover.
  The OpenAPI itself contributes NO schemas: it is Postman-derived and every operation declares
  a bare 200 with an empty content object, so no $ref graph exists to walk.
docs: https://developers.salesloft.com/docs/api/
notation: >-
  relationships use has_one / has_many / belongs_to with the referencing field name; direction is
  from the entity that holds the reference.
reference_idiom: >-
  Salesloft embeds related records as a small object {"_href": "<absolute v2 URL>", "id": <int>}
  rather than a bare foreign key or an expandable sub-object. A client follows _href to hydrate.
  There is no expand[] parameter — see conventions/salesloft-conventions.yml.
id_scheme: >-
  Integer surrogate ids on most resources (Account, Person, User, Opportunity, Task, Note,
  Cadence, Step, Import). Conversations use a string id and additionally carry user_guid /
  organization_id. Users carry BOTH a numeric id and a guid. No prefixed ids.
crm_mirroring: >-
  Nearly every core entity carries crm_id, crm_object_type and crm_url, plus *_crm_id fields on
  its relationships (owner_crm_id, account_crm_id, company_crm_id, created_by_crm_id). Salesloft's
  data model is explicitly a mirror of an external CRM, not a system of record — this is the single
  most load-bearing fact about integrating with it.

