core_graph_summary: >-
  Account is the hub. Person belongs_to Account and to a User (owner); Opportunity and
  Conversation both hang off Account and Person; every engagement artifact (Cadence,
  Step, Task, Call, Email, Note) resolves back to a Person, and every one of them carries a
  parallel CRM identifier so the whole graph can be reconciled against Salesforce, HubSpot
  or Dynamics.

