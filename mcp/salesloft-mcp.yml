generated: '2026-08-13'
method: searched
status: published
source: https://mcp.salesloft.com/
description: >-
  Salesloft operates a first-party remote MCP server at https://mcp.salesloft.com.
  The server root (GET /) publishes the complete tool manifest ANONYMOUSLY —
  15 tools with full JSON Schema inputSchema AND outputSchema per tool — which is
  saved verbatim to mcp/salesloft-mcp-tools.json. The JSON-RPC endpoint itself
  (POST /mcp) is OAuth-protected: an unauthenticated tools/list returns
  {"error":{"code":-32000,"message":"User not authenticated"}} with a
  WWW-Authenticate header pointing at
  https://mcp.salesloft.com/.well-known/oauth-protected-resource.
  The server is listed natively in Claude's connector directory and, as of the
  August 2026 release notes, is also available as a custom connector for ChatGPT.

deployment:
  mode: remote
  endpoint: https://mcp.salesloft.com/mcp
  auth: oauth
  verified: probed

server:
  name: salesloft
  display_name: Specula MCP Server (SalesLoft)
  transport: http
  url: https://mcp.salesloft.com/mcp
  manifest_url: https://mcp.salesloft.com/
  mcp_version: '2024-11-05'
  description: A Model Context Protocol server that provides access to SalesLoft API tools
  tools_file: salesloft-mcp-tools.json
  tool_count: 15

authorization:
  protected_resource: https://mcp.salesloft.com/.well-known/oauth-protected-resource
  authorization_server_metadata: https://mcp.salesloft.com/.well-known/oauth-authorization-server
  authorization_endpoint: https://accounts.salesloft.com/oauth/authorize
  token_endpoint: https://accounts.salesloft.com/oauth/token
  revocation_endpoint: https://accounts.salesloft.com/oauth/revoke
  registration_endpoint: https://accounts.salesloft.com/oauth/client/register
  dynamic_client_registration: true
  grant_types: [authorization_code, refresh_token]
  pkce: [S256, plain]
  scopes:
    - accounts:read
    - conversations:read
    - opportunities:read
    - people:read
    - team:read
    - claudeai

availability:
  entitlement: >-
    Salesloft Agentic customers. A Salesloft Admin must enable the MCP Server toggle
    under Settings > Artificial Intelligence > Salesloft MCP before the connector works.
  clients:
    - {client: Claude, status: native connector directory listing, source: 'https://www.salesloft.com/company/newsroom/salesloft-mcp-server-revenue-data-ai-ecosystem'}
    - {client: ChatGPT, status: custom connector, released: '2026-08-11', source: 'https://champions.salesloft.com/product-updates'}
    - {client: Microsoft Copilot, status: announced, source: 'https://www.salesloft.com/company/newsroom/salesloft-mcp-server-revenue-data-ai-ecosystem'}
    - {client: Google Gemini, status: announced, source: 'https://www.salesloft.com/company/newsroom/salesloft-mcp-server-revenue-data-ai-ecosystem'}
  launched: '2026-04'

posture:
  read_only: true
  note: >-
    Every one of the 15 tools carries annotations {readOnlyHint: true, destructiveHint: false}.
    The server exposes no write path into Salesloft; the two non-read tools
    (report_missing_functionality, submit_feedback) write only to Salesloft's own
    product-feedback channel. A transcript-retrieval tool was REMOVED from the Claude
    server in the August 2026 release because it could not return raw transcript content
    over the protocol — conversation intelligence is now reached through
    conversation_by_id (AI summary, extracted fields, key moments) instead.

tools:
  - {name: current_user, category: identity, method: get, read_only: true, description: "Fetches the authenticated Salesloft user's profile including their ID, GUID, name, and email."}
  - {name: current_team, category: identity, method: get, read_only: true, description: 'Fetches the Salesloft team of the authenticated user, including plan type, feature flags, and settings.'}
  - {name: search_accounts, category: accounts, method: get, read_only: true, description: 'Fetches a paginated list of company accounts, filterable by name, domain, owner, stage, industry, or CRM ID.'}
  - {name: account_by_id, category: accounts, method: get, read_only: true, description: 'Fetches a single company account by its Salesloft account ID.'}
  - {name: search_people, category: people, method: get, read_only: true, description: 'Fetches a paginated list of prospect and contact records, filterable by name, email, account, cadence, owner, or contact status.'}
  - {name: person_by_id, category: people, method: get, read_only: true, description: 'Fetches a single person (prospect or contact) by their Salesloft person ID.'}
  - {name: search_users, category: team, method: get, read_only: true, description: 'Fetches a paginated list of Salesloft team members, filterable by email, name, group, role, or active status.'}
  - {name: user_by_id, category: team, method: get, read_only: true, description: 'Fetches a single Salesloft user by their numeric ID or GUID.'}
  - {name: search_opportunities, category: pipeline, method: get, read_only: true, description: 'Fetches a paginated list of CRM-synced opportunities, filterable by account, owner, stage name, close date, or win status.'}
  - {name: opportunity_by_id, category: pipeline, method: get, read_only: true, description: 'Fetches a single CRM-synced opportunity by its Salesloft opportunity ID.'}
  - {name: search_conversations, category: conversations, method: get, read_only: true, description: 'Fetches a paginated list of recorded conversations, filterable by title, date range, duration, platform, account, person, or owner.'}
  - {name: conversation_by_id, category: conversations, method: get, read_only: true, description: 'Fetches full details of a single conversation by ID, including AI-generated summary, action items, and key moments.'}
  - {name: conversation_recording_by_id, category: conversations, method: get, read_only: true, description: 'Fetches the media recording reference (signed URL) for a single conversation by ID.'}
  - {name: report_missing_functionality, category: meta, read_only: true, description: 'Surfaces a product gap when a user requests a capability no available tool supports.'}
  - {name: submit_feedback, category: meta, read_only: true, description: 'Records explicit user feedback about the quality or accuracy of a response or tool result.'}

