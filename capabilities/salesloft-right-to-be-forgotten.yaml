naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Right to Be Forgotten
  description: 'Salesloft — Right to Be Forgotten. 1 operations. Lead operation: Salesloft Submit a Right to Be Forgotten
    Request. Self-contained Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Right to Be Forgotten
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-right-to-be-forgotten
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Right to Be Forgotten business capability. Self-contained, no shared references.
    resources:
    - name: data_control-right_to_be_forgotten
      path: /data_control/right_to_be_forgotten
      operations:
      - name: post
        method: POST
        description: Salesloft Submit a Right to Be Forgotten Request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-right-to-be-forgotten-rest
    port: 8080
    description: REST adapter for Salesloft — Right to Be Forgotten. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/data-control/right-to-be-forgotten
      name: data-control-right-to-be-forgotten
      description: REST surface for data_control-right_to_be_forgotten.
      operations:
      - method: POST
        name: post
        description: Salesloft Submit a Right to Be Forgotten Request
        call: salesloft-right-to-be-forgotten.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-right-to-be-forgotten-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Right to Be Forgotten. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: salesloft-submit-right-be-forgotten
      description: Salesloft Submit a Right to Be Forgotten Request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesloft-right-to-be-forgotten.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
