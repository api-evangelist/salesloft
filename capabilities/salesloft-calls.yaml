    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Calls business capability. Self-contained, no shared references.
    resources:
    - name: activities-calls
      path: /activities/calls
      operations:
      - name: get
        method: GET
        description: Salesloft List Calls
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: created_at[gt]
          in: query
          type: string
        - name: created_at[gte]
          in: query
          type: string
        - name: created_at[lt]
          in: query
          type: string
        - name: created_at[lte]
          in: query
          type: string
        - name: updated_at[gt]
          in: query
          type: string
        - name: updated_at[gte]
          in: query
          type: string
        - name: updated_at[lt]
          in: query
          type: string
        - name: updated_at[lte]
          in: query
          type: string
        - name: user_guid
          in: query
          type: string
        - name: person_id
          in: query
          type: string
        - name: sentiment
          in: query
          type: string
        - name: disposition
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
      - name: post
        method: POST
        description: Salesloft Create a Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: activities-calls-id
      path: /activities/calls/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch a Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-calls-rest
    port: 8080
    description: REST adapter for Salesloft — Calls. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/activities/calls
      name: activities-calls
      description: REST surface for activities-calls.
      operations:
      - method: GET
        name: get
        description: Salesloft List Calls
        call: salesloft-calls.get
        with:
          ids: rest.ids
          created_at[gt]: rest.created_at[gt]
          created_at[gte]: rest.created_at[gte]
          created_at[lt]: rest.created_at[lt]
          created_at[lte]: rest.created_at[lte]
          updated_at[gt]: rest.updated_at[gt]
          updated_at[gte]: rest.updated_at[gte]
          updated_at[lt]: rest.updated_at[lt]
          updated_at[lte]: rest.updated_at[lte]
          user_guid: rest.user_guid
          person_id: rest.person_id
          sentiment: rest.sentiment
          disposition: rest.disposition
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
