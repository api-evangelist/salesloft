naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Calls
  description: 'Salesloft — Calls. 3 operations. Lead operation: Salesloft List Calls. Self-contained Naftiko capability covering
    one Salesloft business surface.'
  tags:
  - Salesloft
  - Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
