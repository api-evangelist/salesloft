    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Email Missing Tags. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-requests-check-template-missed
      description: Salesloft Requests a Check of the Template for Missed Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesloft-email-missing-tags.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
