naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Client Credentials Access Token
  description: 'Salesloft — Client Credentials Access Token. 1 operations. Lead operation: Salesloft Retrieve Client Credentials
    Access Token. Self-contained Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Client Credentials Access Token
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-client-credentials-access-token
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Client Credentials Access Token business capability. Self-contained, no shared references.
    resources:
    - name: oauth-token
      path: /oauth/token
      operations:
      - name: post
        method: POST
        description: Salesloft Retrieve Client Credentials Access Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: client_id
          in: query
          type: string
        - name: client_secret
          in: query
          type: string
        - name: grant_type
          in: query
          type: string
        - name: scope
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-client-credentials-access-token-rest
    port: 8080
    description: REST adapter for Salesloft — Client Credentials Access Token. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/oauth/token
      name: oauth-token
      description: REST surface for oauth-token.
      operations:
      - method: POST
        name: post
        description: Salesloft Retrieve Client Credentials Access Token
        call: salesloft-client-credentials-access-token.post
        with:
          client_id: rest.client_id
          client_secret: rest.client_secret
          grant_type: rest.grant_type
          scope: rest.scope
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-client-credentials-access-token-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Client Credentials Access Token. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: salesloft-retrieve-client-credentials-access
      description: Salesloft Retrieve Client Credentials Access Token
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesloft-client-credentials-access-token.post
      with:
        client_id: tools.client_id
        client_secret: tools.client_secret
        grant_type: tools.grant_type
        scope: tools.scope
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
