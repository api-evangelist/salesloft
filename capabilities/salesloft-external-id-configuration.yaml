naftiko: 1.0.0-alpha2
info:
  label: Salesloft — External Id Configuration
  description: 'Salesloft — External Id Configuration. 2 operations. Lead operation: Salesloft Create a Configuration. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - External Id Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-external-id-configuration
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — External Id Configuration business capability. Self-contained, no shared references.
    resources:
    - name: configurations
      path: /configurations
      operations:
      - name: post
        method: POST
        description: Salesloft Create a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: external-configurations-id
      path: /external/configurations/{id}
      operations:
      - name: delete
        method: DELETE
        description: Salesloft Delete a Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-external-id-configuration-rest
    port: 8080
    description: REST adapter for Salesloft — External Id Configuration. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/configurations
      name: configurations
      description: REST surface for configurations.
      operations:
      - method: POST
        name: post
        description: Salesloft Create a Configuration
        call: salesloft-external-id-configuration.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/external/configurations/{id}
      name: external-configurations-id
      description: REST surface for external-configurations-id.
      operations:
      - method: DELETE
        name: delete
        description: Salesloft Delete a Configuration
        call: salesloft-external-id-configuration.delete
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-external-id-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — External Id Configuration. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: salesloft-create-configuration
      description: Salesloft Create a Configuration
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesloft-external-id-configuration.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: salesloft-delete-configuration
      description: Salesloft Delete a Configuration
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: salesloft-external-id-configuration.delete
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
