naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Cadence Stats
  description: 'Salesloft — Cadence Stats. 1 operations. Lead operation: Salesloft Fetch Stats for a Cadence. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Cadence Stats
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-cadence-stats
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Cadence Stats business capability. Self-contained, no shared references.
    resources:
    - name: cadence_stats-id
      path: /cadence_stats/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch Stats for a Cadence
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-cadence-stats-rest
    port: 8080
    description: REST adapter for Salesloft — Cadence Stats. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/cadence-stats/{id}
      name: cadence-stats-id
      description: REST surface for cadence_stats-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch Stats for a Cadence
        call: salesloft-cadence-stats.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-cadence-stats-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Cadence Stats. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-fetch-stats-cadence
      description: Salesloft Fetch Stats for a Cadence
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-cadence-stats.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
