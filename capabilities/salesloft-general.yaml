naftiko: 1.0.0-alpha2
info:
  label: Salesloft
  description: 'Salesloft. 1 operations. Lead operation: Salesloft List Team Tags. Self-contained Naftiko capability covering
    one Salesloft business surface.'
  tags:
  - Salesloft
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-general
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft business capability. Self-contained, no shared references.
    resources:
    - name: tags
      path: /tags
      operations:
      - name: get
        method: GET
        description: Salesloft List Team Tags
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-general-rest
    port: 8080
    description: REST adapter for Salesloft. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/tags
      name: tags
      description: REST surface for tags.
      operations:
      - method: GET
        name: get
        description: Salesloft List Team Tags
        call: salesloft-general.get
        with:
          ids: rest.ids
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft. One tool per consumed operation, routed inline through this capability's consumes
      block.
    tools:
    - name: salesloft-list-team-tags
      description: Salesloft List Team Tags
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-general.get
      with:
        ids: tools.ids
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
      outputParameters:
      - type: object
        mapping: $.
