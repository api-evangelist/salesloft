naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Requests
  description: 'Salesloft — Requests. 2 operations. Lead operation: Salesloft Retrieve a List of Requests. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Requests
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-requests
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Requests business capability. Self-contained, no shared references.
    resources:
    - name: data_control-requests
      path: /data_control/requests
      operations:
      - name: get
        method: GET
        description: Salesloft Retrieve a List of Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: team_id
          in: query
          type: string
        - name: request_type
          in: query
          type: string
        - name: dry_run
          in: query
          type: string
        - name: user_guid
          in: query
          type: string
    - name: data_control-requests-id
      path: /data_control/requests/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch a Request Record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-requests-rest
    port: 8080
    description: REST adapter for Salesloft — Requests. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/data-control/requests
      name: data-control-requests
      description: REST surface for data_control-requests.
      operations:
      - method: GET
        name: get
        description: Salesloft Retrieve a List of Requests
        call: salesloft-requests.get
        with:
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          team_id: rest.team_id
          request_type: rest.request_type
          dry_run: rest.dry_run
          user_guid: rest.user_guid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data-control/requests/{id}
      name: data-control-requests-id
      description: REST surface for data_control-requests-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch a Request Record
        call: salesloft-requests.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-requests-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Requests. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-retrieve-list-requests
      description: Salesloft Retrieve a List of Requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-requests.get
      with:
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        team_id: tools.team_id
        request_type: tools.request_type
        dry_run: tools.dry_run
        user_guid: tools.user_guid
      outputParameters:
      - type: object
        mapping: $.
    - name: salesloft-fetch-request-record
      description: Salesloft Fetch a Request Record
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-requests.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
