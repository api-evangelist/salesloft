naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Recording Settings
  description: 'Salesloft — Recording Settings. 1 operations. Lead operation: Salesloft Fetch Recording Setting. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Recording Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-recording-settings
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Recording Settings business capability. Self-contained, no shared references.
    resources:
    - name: phone_numbers-recording_settings-id
      path: /phone_numbers/recording_settings/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch Recording Setting
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-recording-settings-rest
    port: 8080
    description: REST adapter for Salesloft — Recording Settings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/phone-numbers/recording-settings/{id}
      name: phone-numbers-recording-settings-id
      description: REST surface for phone_numbers-recording_settings-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch Recording Setting
        call: salesloft-recording-settings.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-recording-settings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Recording Settings. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-fetch-recording-setting
      description: Salesloft Fetch Recording Setting
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-recording-settings.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
