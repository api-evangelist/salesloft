naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Activities
  description: 'Salesloft — Activities. 1 operations. Lead operation: Salesloft Create an Activity. Self-contained Naftiko
    capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Activities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-activities
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Activities business capability. Self-contained, no shared references.
    resources:
    - name: activities
      path: /activities
      operations:
      - name: get
        method: GET
        description: Salesloft Create an Activity
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-activities-rest
    port: 8080
    description: REST adapter for Salesloft — Activities. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/activities
      name: activities
      description: REST surface for activities.
      operations:
      - method: GET
        name: get
        description: Salesloft Create an Activity
        call: salesloft-activities.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-activities-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Activities. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-create-activity
      description: Salesloft Create an Activity
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-activities.get
      outputParameters:
      - type: object
        mapping: $.
