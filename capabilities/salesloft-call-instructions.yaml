naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Call Instructions
  description: 'Salesloft — Call Instructions. 2 operations. Lead operation: Salesloft List Call Instructions. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Call Instructions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-call-instructions
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Call Instructions business capability. Self-contained, no shared references.
    resources:
    - name: action_details-call_instructions
      path: /action_details/call_instructions
      operations:
      - name: get
        method: GET
        description: Salesloft List Call Instructions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    - name: action_details-call_instructions-id
      path: /action_details/call_instructions/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch a Call Instructions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-call-instructions-rest
    port: 8080
    description: REST adapter for Salesloft — Call Instructions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/action-details/call-instructions
      name: action-details-call-instructions
      description: REST surface for action_details-call_instructions.
      operations:
      - method: GET
        name: get
        description: Salesloft List Call Instructions
        call: salesloft-call-instructions.get
        with:
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/action-details/call-instructions/{id}
      name: action-details-call-instructions-id
      description: REST surface for action_details-call_instructions-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch a Call Instructions
        call: salesloft-call-instructions.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-call-instructions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Call Instructions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-list-call-instructions
      description: Salesloft List Call Instructions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-call-instructions.get
      with:
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
      outputParameters:
      - type: object
        mapping: $.
    - name: salesloft-fetch-call-instructions
      description: Salesloft Fetch a Call Instructions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-call-instructions.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
