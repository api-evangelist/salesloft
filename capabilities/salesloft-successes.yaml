naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Successes
  description: 'Salesloft — Successes. 1 operations. Lead operation: Salesloft List Successes. Self-contained Naftiko capability
    covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Successes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-successes
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Successes business capability. Self-contained, no shared references.
    resources:
    - name: successes
      path: /successes
      operations:
      - name: get
        method: GET
        description: Salesloft List Successes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: person_id
          in: query
          type: string
        - name: updated_at[gt]
          in: query
          type: string
        - name: updated_at[gte]
          in: query
          type: string
        - name: updated_at[lt]
          in: query
          type: string
        - name: updated_at[lte]
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-successes-rest
    port: 8080
    description: REST adapter for Salesloft — Successes. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/successes
      name: successes
      description: REST surface for successes.
      operations:
      - method: GET
        name: get
        description: Salesloft List Successes
        call: salesloft-successes.get
        with:
          ids: rest.ids
          person_id: rest.person_id
          updated_at[gt]: rest.updated_at[gt]
          updated_at[gte]: rest.updated_at[gte]
          updated_at[lt]: rest.updated_at[lt]
          updated_at[lte]: rest.updated_at[lte]
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-successes-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Successes. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-list-successes
      description: Salesloft List Successes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-successes.get
      with:
        ids: tools.ids
        person_id: tools.person_id
        updated_at[gt]: tools.updated_at[gt]
        updated_at[gte]: tools.updated_at[gte]
        updated_at[lt]: tools.updated_at[lt]
        updated_at[lte]: tools.updated_at[lte]
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
      outputParameters:
      - type: object
        mapping: $.
