naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Bulk Jobs - Results
  description: 'Salesloft — Bulk Jobs - Results. 1 operations. Lead operation: Salesloft List Job Data for a Completed Bulk
    Job. Self-contained Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Bulk Jobs - Results
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-bulk-jobs-results
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Bulk Jobs - Results business capability. Self-contained, no shared references.
    resources:
    - name: bulk_jobs-bulk_jobs_id-results
      path: /bulk_jobs/{bulk_jobs_id}/results
      operations:
      - name: get
        method: GET
        description: Salesloft List Job Data for a Completed Bulk Job
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
        - name: id
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: bulk_jobs_id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-bulk-jobs-results-rest
    port: 8080
    description: REST adapter for Salesloft — Bulk Jobs - Results. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/bulk-jobs/{bulk-jobs-id}/results
      name: bulk-jobs-bulk-jobs-id-results
      description: REST surface for bulk_jobs-bulk_jobs_id-results.
      operations:
      - method: GET
        name: get
        description: Salesloft List Job Data for a Completed Bulk Job
        call: salesloft-bulk-jobs-results.get
        with:
          status: rest.status
          id: rest.id
          per_page: rest.per_page
          bulk_jobs_id: rest.bulk_jobs_id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-bulk-jobs-results-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Bulk Jobs - Results. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-list-job-data-completed
      description: Salesloft List Job Data for a Completed Bulk Job
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-bulk-jobs-results.get
      with:
        status: tools.status
        id: tools.id
        per_page: tools.per_page
        bulk_jobs_id: tools.bulk_jobs_id
      outputParameters:
      - type: object
        mapping: $.
