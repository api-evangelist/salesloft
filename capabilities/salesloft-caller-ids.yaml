naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Caller Ids
  description: 'Salesloft — Caller Ids. 1 operations. Lead operation: Salesloft List Caller Ids. Self-contained Naftiko capability
    covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Caller Ids
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-caller-ids
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Caller Ids business capability. Self-contained, no shared references.
    resources:
    - name: phone_numbers-caller_ids
      path: /phone_numbers/caller_ids
      operations:
      - name: get
        method: GET
        description: Salesloft List Caller Ids
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: phone_number
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-caller-ids-rest
    port: 8080
    description: REST adapter for Salesloft — Caller Ids. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/phone-numbers/caller-ids
      name: phone-numbers-caller-ids
      description: REST surface for phone_numbers-caller_ids.
      operations:
      - method: GET
        name: get
        description: Salesloft List Caller Ids
        call: salesloft-caller-ids.get
        with:
          phone_number: rest.phone_number
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-caller-ids-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Caller Ids. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-list-caller-ids
      description: Salesloft List Caller Ids
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-caller-ids.get
      with:
        phone_number: tools.phone_number
      outputParameters:
      - type: object
        mapping: $.
