naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Ongoing Actions
  description: 'Salesloft — Ongoing Actions. 1 operations. Lead operation: Salesloft Create an Ongoing Action. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Ongoing Actions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-ongoing-actions
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Ongoing Actions business capability. Self-contained, no shared references.
    resources:
    - name: ongoing_actions
      path: /ongoing_actions
      operations:
      - name: post
        method: POST
        description: Salesloft Create an Ongoing Action
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-ongoing-actions-rest
    port: 8080
    description: REST adapter for Salesloft — Ongoing Actions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/ongoing-actions
      name: ongoing-actions
      description: REST surface for ongoing_actions.
      operations:
      - method: POST
        name: post
        description: Salesloft Create an Ongoing Action
        call: salesloft-ongoing-actions.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-ongoing-actions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Ongoing Actions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-create-ongoing-action
      description: Salesloft Create an Ongoing Action
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesloft-ongoing-actions.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
