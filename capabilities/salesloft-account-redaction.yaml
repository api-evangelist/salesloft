naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Account Redaction
  description: 'Salesloft — Account Redaction. 1 operations. Lead operation: Salesloft Execute an Account Redaction Workflow.
    Self-contained Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Account Redaction
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-account-redaction
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Account Redaction business capability. Self-contained, no shared references.
    resources:
    - name: data_control-account_redaction
      path: /data_control/account_redaction
      operations:
      - name: post
        method: POST
        description: Salesloft Execute an Account Redaction Workflow
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-account-redaction-rest
    port: 8080
    description: REST adapter for Salesloft — Account Redaction. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/data-control/account-redaction
      name: data-control-account-redaction
      description: REST surface for data_control-account_redaction.
      operations:
      - method: POST
        name: post
        description: Salesloft Execute an Account Redaction Workflow
        call: salesloft-account-redaction.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-account-redaction-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Account Redaction. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-execute-account-redaction-workflow
      description: Salesloft Execute an Account Redaction Workflow
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesloft-account-redaction.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
