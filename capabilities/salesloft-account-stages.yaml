  - type: http
    namespace: salesloft-account-stages
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Account Stages business capability. Self-contained, no shared references.
    resources:
    - name: account_stages
      path: /account_stages
      operations:
      - name: get
        method: GET
        description: Salesloft List Account Stages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: updated_at[gt]
          in: query
          type: string
        - name: updated_at[gte]
          in: query
          type: string
        - name: updated_at[lt]
          in: query
          type: string
        - name: updated_at[lte]
          in: query
          type: string
        - name: active
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_driection
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    - name: account_stages-id
      path: /account_stages/{id}
