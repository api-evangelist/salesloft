      description: REST surface for account_stages-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch an Account Stage
        call: salesloft-account-stages.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
