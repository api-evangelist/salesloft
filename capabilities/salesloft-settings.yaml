naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Settings
  description: 'Salesloft — Settings. 1 operations. Lead operation: Salesloft Update a Meeting Setting. Self-contained Naftiko
    capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-settings
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Settings business capability. Self-contained, no shared references.
    resources:
    - name: meetings-settings-id
      path: /meetings/settings/{id}
      operations:
      - name: put
        method: PUT
        description: Salesloft Update a Meeting Setting
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-settings-rest
    port: 8080
    description: REST adapter for Salesloft — Settings. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/meetings/settings/{id}
      name: meetings-settings-id
      description: REST surface for meetings-settings-id.
      operations:
      - method: PUT
        name: put
        description: Salesloft Update a Meeting Setting
        call: salesloft-settings.put
        with:
          id: rest.id
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-settings-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Settings. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-update-meeting-setting
      description: Salesloft Update a Meeting Setting
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: salesloft-settings.put
      with:
        id: tools.id
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
