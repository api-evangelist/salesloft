naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Account Tiers
  description: 'Salesloft — Account Tiers. 2 operations. Lead operation: Salesloft List Account Tiers. Self-contained Naftiko
    capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Account Tiers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-account-tiers
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Account Tiers business capability. Self-contained, no shared references.
    resources:
    - name: account_tiers
      path: /account_tiers
      operations:
      - name: get
        method: GET
        description: Salesloft List Account Tiers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: name
          in: query
          type: string
        - name: active
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    - name: account_tiers-id
      path: /account_tiers/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch an Account Tier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-account-tiers-rest
    port: 8080
    description: REST adapter for Salesloft — Account Tiers. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/account-tiers
      name: account-tiers
      description: REST surface for account_tiers.
      operations:
      - method: GET
        name: get
        description: Salesloft List Account Tiers
        call: salesloft-account-tiers.get
        with:
          ids: rest.ids
          name: rest.name
          active: rest.active
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/account-tiers/{id}
      name: account-tiers-id
      description: REST surface for account_tiers-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch an Account Tier
        call: salesloft-account-tiers.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-account-tiers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Account Tiers. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-list-account-tiers
      description: Salesloft List Account Tiers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-account-tiers.get
      with:
        ids: tools.ids
        name: tools.name
        active: tools.active
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
      outputParameters:
      - type: object
        mapping: $.
    - name: salesloft-fetch-account-tier
      description: Salesloft Fetch an Account Tier
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-account-tiers.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
