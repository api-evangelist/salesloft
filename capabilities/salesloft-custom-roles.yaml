naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Custom Roles
  description: 'Salesloft — Custom Roles. 2 operations. Lead operation: Salesloft List Custom Roles. Self-contained Naftiko
    capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Custom Roles
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-custom-roles
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Custom Roles business capability. Self-contained, no shared references.
    resources:
    - name: custom_roles
      path: /custom_roles
      operations:
      - name: get
        method: GET
        description: Salesloft List Custom Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: ids
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
    - name: custom_roles-id
      path: /custom_roles/{id}
      operations:
      - name: get
        method: GET
        description: Salesloft Fetch a Custom Role
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-custom-roles-rest
    port: 8080
    description: REST adapter for Salesloft — Custom Roles. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/custom-roles
      name: custom-roles
      description: REST surface for custom_roles.
      operations:
      - method: GET
        name: get
        description: Salesloft List Custom Roles
        call: salesloft-custom-roles.get
        with:
          ids: rest.ids
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/custom-roles/{id}
      name: custom-roles-id
      description: REST surface for custom_roles-id.
      operations:
      - method: GET
        name: get
        description: Salesloft Fetch a Custom Role
        call: salesloft-custom-roles.get
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-custom-roles-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Custom Roles. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-list-custom-roles
      description: Salesloft List Custom Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-custom-roles.get
      with:
        ids: tools.ids
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
      outputParameters:
      - type: object
        mapping: $.
    - name: salesloft-fetch-custom-role
      description: Salesloft Fetch a Custom Role
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-custom-roles.get
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
