naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Team
  description: 'Salesloft — Team. 1 operations. Lead operation: Salesloft Get Current Team. Self-contained Naftiko capability
    covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Team
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-team
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Team business capability. Self-contained, no shared references.
    resources:
    - name: team
      path: /team
      operations:
      - name: get
        method: GET
        description: Salesloft Get Current Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-team-rest
    port: 8080
    description: REST adapter for Salesloft — Team. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/team
      name: team
      description: REST surface for team.
      operations:
      - method: GET
        name: get
        description: Salesloft Get Current Team
        call: salesloft-team.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-team-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Team. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-get-current-team
      description: Salesloft Get Current Team
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: salesloft-team.get
      outputParameters:
      - type: object
        mapping: $.
