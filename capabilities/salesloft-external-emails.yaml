      with /v1.
    resources:
    - path: /v1/external-emails
      name: external-emails
      description: REST surface for external_emails.
      operations:
      - method: POST
        name: post
        description: Salesloft Create an External Email
        call: salesloft-external-emails.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
