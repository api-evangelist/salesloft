naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Searches
  description: 'Salesloft — Searches. 1 operations. Lead operation: Salesloft List Meeting Settings. Self-contained Naftiko
    capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Searches
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-searches
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Searches business capability. Self-contained, no shared references.
    resources:
    - name: meetings-settings-searches
      path: /meetings/settings/searches
      operations:
      - name: post
        method: POST
        description: Salesloft List Meeting Settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: user_guids
          in: query
          type: string
        - name: updated_at[gt]
          in: query
          type: string
        - name: updated_at[gte]
          in: query
          type: string
        - name: updated_at[lt]
          in: query
          type: string
        - name: updated_at[lte]
          in: query
          type: string
        - name: calendar_type
          in: query
          type: string
        - name: sort_by
          in: query
          type: string
        - name: sort_direction
          in: query
          type: string
        - name: per_page
          in: query
          type: string
        - name: page
          in: query
          type: string
        - name: include_paging_counts
          in: query
          type: string
        - name: limit_paging_counts
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-searches-rest
    port: 8080
    description: REST adapter for Salesloft — Searches. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/meetings/settings/searches
      name: meetings-settings-searches
      description: REST surface for meetings-settings-searches.
      operations:
      - method: POST
        name: post
        description: Salesloft List Meeting Settings
        call: salesloft-searches.post
        with:
          user_guids: rest.user_guids
          updated_at[gt]: rest.updated_at[gt]
          updated_at[gte]: rest.updated_at[gte]
          updated_at[lt]: rest.updated_at[lt]
          updated_at[lte]: rest.updated_at[lte]
          calendar_type: rest.calendar_type
          sort_by: rest.sort_by
          sort_direction: rest.sort_direction
          per_page: rest.per_page
          page: rest.page
          include_paging_counts: rest.include_paging_counts
          limit_paging_counts: rest.limit_paging_counts
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-searches-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Searches. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: salesloft-list-meeting-settings
      description: Salesloft List Meeting Settings
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: salesloft-searches.post
      with:
        user_guids: tools.user_guids
        updated_at[gt]: tools.updated_at[gt]
        updated_at[gte]: tools.updated_at[gte]
        updated_at[lt]: tools.updated_at[lt]
        updated_at[lte]: tools.updated_at[lte]
        calendar_type: tools.calendar_type
        sort_by: tools.sort_by
        sort_direction: tools.sort_direction
        per_page: tools.per_page
        page: tools.page
        include_paging_counts: tools.include_paging_counts
        limit_paging_counts: tools.limit_paging_counts
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
