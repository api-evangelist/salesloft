naftiko: 1.0.0-alpha2
info:
  label: Salesloft — Conversations Calls
  description: 'Salesloft — Conversations Calls. 1 operations. Lead operation: Salesloft Create a New Call. Self-contained
    Naftiko capability covering one Salesloft business surface.'
  tags:
  - Salesloft
  - Conversations Calls
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SALESLOFT_API_KEY: SALESLOFT_API_KEY
capability:
  consumes:
  - type: http
    namespace: salesloft-conversations-calls
    baseUri: http://{{salesloft_api_base_url}}
    description: Salesloft — Conversations Calls business capability. Self-contained, no shared references.
    resources:
    - name: conversations-calls
      path: /conversations/calls
      operations:
      - name: post
        method: POST
        description: Salesloft Create a New Call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SALESLOFT_API_KEY}}'
  exposes:
  - type: rest
    namespace: salesloft-conversations-calls-rest
    port: 8080
    description: REST adapter for Salesloft — Conversations Calls. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/conversations/calls
      name: conversations-calls
      description: REST surface for conversations-calls.
      operations:
      - method: POST
        name: post
        description: Salesloft Create a New Call
        call: salesloft-conversations-calls.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: salesloft-conversations-calls-mcp
    port: 9090
    transport: http
    description: MCP adapter for Salesloft — Conversations Calls. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: salesloft-create-new-call
      description: Salesloft Create a New Call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: salesloft-conversations-calls.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
