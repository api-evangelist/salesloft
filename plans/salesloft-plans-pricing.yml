description: >-
  Salesloft publishes NO prices. The pricing page (https://www.salesloft.com/pricing, HTTP 200)
  is a contact-sales page: it lists platform capabilities and customer proof points, then routes
  every visitor to a 15-minute intro call. No tier names, no per-seat prices, no currency, no
  billing period, and no API quota or overage schedule are stated anywhere on the public site.
  There is no separate API price list either — API access is a property of the subscription, and
  the API rate limit is a per-team cost budget that Salesloft adjusts on request rather than a
  purchasable quota (see rate-limits/salesloft-rate-limits.yml).
notes: >-
  Replaces the 2026-05-08 placeholder scaffold. plan_count is 0 because the provider publishes
  zero priced tiers, not because the pricing page could not be read — it was fetched and read.
  The one machine-readable trace of Salesloft's tiering is not on the pricing page at all: the
  current_team tool on the public MCP manifest (https://mcp.salesloft.com/) declares
  team.plan as an enum of "group | professional | enterprise", and team.plan_features as an
  add-on object. Recorded here as the only provider-published tier vocabulary; no price attaches
  to any of the three.

