description: >-
  Salesloft publishes dated, monthly release notes on its customer community (Champions),
  not on the developer portal — developers.salesloft.com has no changelog page anywhere in
  its 88-page sitemap. The notes are product-wide (Salesloft, Copilot, Clari, Groove, Drift)
  and API/agent changes are announced inside them rather than in a separate API changelog.
  Recent window only; the live page is the source of truth.
