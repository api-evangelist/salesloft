api_specific_changelog_note: >-
  This is the material gap for an integrator: an API consumer must read a product-wide
  marketing-adjacent release note to learn that an MCP tool was removed or that an auth
  integration has a hard migration deadline. There is no per-version API changelog, no RSS
  feed dedicated to API changes, and no machine-readable release feed.

