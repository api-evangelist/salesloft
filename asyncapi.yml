      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/SalesloftWebhookHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'

    CadenceMembershipUpdated:
      name: cadence_membership_updated
