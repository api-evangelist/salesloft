    TaskCreated:
      name: task_created
      title: Task Created
      summary: Sent when a Task is created.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/SalesloftWebhookHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'

    TaskUpdated:
      name: task_updated
      title: Task Updated
      summary: Sent when a Task is updated.
      contentType: application/json
      traits:
