      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/SalesloftWebhookHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'

    CallCreated:
      name: call_created
      title: Call Created
      summary: Sent when a Call activity is created.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/SalesloftWebhookHeaders'
      payload:
