      summary: Sent when a Cadence Step is updated.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/SalesloftWebhookHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'

    StepDeleted:
