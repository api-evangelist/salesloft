openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Profiles API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Profiles
  description: '[https://developers.salesloft.com/docs/api/profiles/](https://developers.salesloft.com/docs/api/profiles/)'
paths:
  /profiles:
    get:
      tags:
      - Profiles
      summary: Salesloft Fetch Current User's Profile
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
