openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Actions API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Actions
  description: '[https://developer.salesloft.com/docs/api/actions/](https://developer.salesloft.com/docs/api/actions/)'
paths:
  /actions:
    get:
      tags:
      - Actions
      summary: Salesloft List Actions
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: step_id
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: due_on[gt]
        in: query
        schema:
          type: string
      - name: due_on[gte]
        in: query
        schema:
          type: string
      - name: due_on[lt]
        in: query
        schema:
          type: string
      - name: due_on[lte]
        in: query
        schema:
          type: string
      - name: user_guid
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: cadence_id
        in: query
        schema:
          type: string
      - name: multitouch_group_id
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /actions/{id}:
    get:
      tags:
      - Actions
      summary: Salesloft Fetch an Action
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
