paths:
  /me:
    get:
      tags:
        - Me
      summary: Get Current User
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /team:
    get:
      tags:
        - Team
      summary: Get Current Team
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /data_control/account_redaction:
    post:
      tags:
        - Account Redaction
      summary: Execute an account redaction workflow
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                team_id: 0
                schedule: {}
                dry_run: true
                account_id: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_stages:
    get:
      tags:
        - Account Stages
      summary: List account stages
      parameters:
        - name: ids
          in: query
          schema:
            type: string
        - name: updated_at[gt]
          in: query
          schema:
            type: string
        - name: updated_at[gte]
          in: query
          schema:
            type: string
        - name: updated_at[lt]
          in: query
          schema:
            type: string
        - name: updated_at[lte]
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_driection
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: include_paging_counts
          in: query
          schema:
            type: string
        - name: limit_paging_counts
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_stages/{id}:
    get:
      tags:
        - Account Stages
      summary: Fetch an account stage
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_team_member_roles:
    get:
      tags:
        - Account Team Member Roles
      summary: List CRM Account Team Member Roles
      parameters:
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_direction
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: include_paging_counts
          in: query
          schema:
            type: string
        - name: limit_paging_counts
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_tiers:
    get:
      tags:
        - Account Tiers
      summary: List Account Tiers
      parameters:
        - name: ids
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
        - name: sort_direction
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: string
        - name: include_paging_counts
          in: query
          schema:
            type: string
        - name: limit_paging_counts
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_tiers/{id}:
    get:
      tags:
        - Account Tiers
      summary: Fetch an account tier
      parameters:
        - name: id
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /account_upserts:
    post:
      tags:
        - Account Upserts
      summary: Upsert an account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                id: string
                name: string
                domain: string
                conversational_name: string
                description: string
                phone: string
                website: string
                linkedin_url: string
                twitter_handle: string
                street: string
                city: string
                state: string
                postal_code: string
                country: string
                locale: string
                industry: string
                company_type: string
                founded: string
                revenue_range: string
                size: string
                do_not_contact: string
                custom_fields: {}
                tags: string
                owner_id: string
                company_stage_id: string
                account_tier_id: string
                crm_id_type: string
                crm_id: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /data_control/account_and_people_redaction:
    post:
      tags:
        - Account and People Redaction
      summary: Submit an account and people redaction request
