openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Counts API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Counts
  description: '[https://developer.salesloft.com/docs/api/counts/](https://developer.salesloft.com/docs/api/counts/)'
paths:
  /tasks/counts:
    get:
      tags:
      - Counts
      summary: Salesloft Fetch Task Counts
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: user_id
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: account_id
        in: query
        schema:
          type: string
      - name: current_state
        in: query
        schema:
          type: string
      - name: task_type
        in: query
        schema:
          type: string
      - name: time_interval_filter
        in: query
        schema:
          type: string
      - name: completed_time_interval
        in: query
        schema:
          type: string
      - name: idempotency_key
        in: query
        schema:
          type: string
      - name: locale
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
