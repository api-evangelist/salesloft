openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Imports API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Imports
  description: '[https://developer.salesloft.com/docs/api/imports/](https://developer.salesloft.com/docs/api/imports/)'
paths:
  /imports:
    get:
      tags:
      - Imports
      summary: Salesloft List Imports
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: user_ids
        in: query
        schema:
          type: string
      - name: import_type
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
      - name: created_at[gt]
        in: query
        schema:
          type: string
      - name: created_at[gte]
        in: query
        schema:
          type: string
      - name: created_at[lt]
        in: query
        schema:
          type: string
      - name: created_at[lte]
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Imports
      summary: Salesloft Create an Import
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                user_id: 0
                name: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /imports/{id}:
    get:
      tags:
      - Imports
      summary: Salesloft Fetch an Import
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
      - Imports
      summary: Salesloft Update an Import
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                user_id: 0
                name: string
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - Imports
      summary: Salesloft Delete an Import
      parameters:
      - name: undo
        in: query
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
