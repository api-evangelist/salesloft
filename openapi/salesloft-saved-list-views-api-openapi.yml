openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Saved List Views API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Saved List Views
  description: '[https://developer.salesloft.com/docs/api/saved-list-views/](https://developer.salesloft.com/docs/api/saved-list-views/)'
paths:
  /saved_list_views:
    get:
      tags:
      - Saved List Views
      summary: Salesloft List Saved List Views
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: view
        in: query
        schema:
          type: string
      - name: shared
        in: query
        schema:
          type: string
      - name: include_shared
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Saved List Views
      summary: Salesloft Create a Saved List View
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: string
                view: string
                is_default: true
                view_params: string
                shared: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /saved_list_views/{id}:
    put:
      tags:
      - Saved List Views
      summary: Salesloft Update a Saved List View
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: string
                is_default: true
                view_params: string
                shared: true
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:
      - Saved List Views
      summary: Salesloft Fetch a Saved List View
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - Saved List Views
      summary: Salesloft Delete a Saved List View
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
