openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Right to Be Forgotten API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Right to Be Forgotten
  description: '[https://developer.salesloft.com/docs/api/right-to-be-forgotten/](https://developer.salesloft.com/docs/api/right-to-be-forgotten/)'
paths:
  /data_control/right_to_be_forgotten:
    post:
      tags:
      - Right to Be Forgotten
      summary: Salesloft Submit a Right to Be Forgotten Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                team_id: 0
                schedule: {}
                people_ids:
                - 0
                dry_run: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
