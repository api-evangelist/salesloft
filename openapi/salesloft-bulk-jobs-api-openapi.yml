openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Bulk Jobs API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Bulk Jobs
  description: '[https://developer.salesloft.com/docs/api/bulk-jobs/](https://developer.salesloft.com/docs/api/bulk-jobs/)'
paths:
  /bulk_jobs/{id}:
    put:
      tags:
      - Bulk Jobs
      summary: Salesloft Update a Bulk Job
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                ready_to_execute: true
                name: string
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:
      - Bulk Jobs
      summary: Salesloft Fetch a Bulk Job
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /bulk_jobs:
    post:
      tags:
      - Bulk Jobs
      summary: Salesloft Create a Bulk Job
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                type: string
                name: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    get:
      tags:
      - Bulk Jobs
      summary: Salesloft List Bulk Jobs
      parameters:
      - name: state
        in: query
        schema:
          type: string
      - name: id
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
