openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Emails API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Emails
  description: '[https://developer.salesloft.com/docs/api/emails/](https://developer.salesloft.com/docs/api/emails/)'
paths:
  /activities/emails:
    get:
      tags:
      - Emails
      summary: Salesloft List Emails
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: bounced
        in: query
        schema:
          type: string
      - name: crm_activity_id
        in: query
        schema:
          type: string
      - name: action_id
        in: query
        schema:
          type: string
      - name: user_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
        example: ' '
      - name: cadence_id
        in: query
        schema:
          type: string
      - name: step_id
        in: query
        schema:
          type: string
      - name: one_off
        in: query
        schema:
          type: string
      - name: scoped_fields
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: email_addresses
        in: query
        schema:
          type: string
      - name: personalization
        in: query
        schema:
          type: string
      - name: sent_at[gt]
        in: query
        schema:
          type: string
      - name: sent_at[gte]
        in: query
        schema:
          type: string
      - name: sent_at[lt]
        in: query
        schema:
          type: string
      - name: sent_at[lte]
        in: query
        schema:
          type: string
      - name: email_template_id
        in: query
        schema:
          type: string
      - name: account_id
        in: query
        schema:
          type: string
      - name: has_replies
        in: query
        schema:
          type: string
      - name: has_clicks
        in: query
        schema:
          type: string
      - name: has_views
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /activities/emails/{id}:
    get:
      tags:
      - Emails
      summary: Salesloft Fetch an Email
      parameters:
      - name: scoped_fields
        in: query
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
