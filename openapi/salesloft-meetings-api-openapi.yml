openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Meetings API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Meetings
  description: '[https://developer.salesloft.com/docs/api/meetings/](https://developer.salesloft.com/docs/api/meetings/)'
paths:
  /meetings:
    get:
      tags:
      - Meetings
      summary: Salesloft List Meetings
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: account_id
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: event_ids
        in: query
        schema:
          type: string
      - name: i_cal_uids
        in: query
        schema:
          type: string
      - name: task_ids
        in: query
        schema:
          type: string
      - name: include_meetings_settings
        in: query
        schema:
          type: string
      - name: start_time[gt]
        in: query
        schema:
          type: string
      - name: start_time[gte]
        in: query
        schema:
          type: string
      - name: start_time[lt]
        in: query
        schema:
          type: string
      - name: start_time[lte]
        in: query
        schema:
          type: string
      - name: created_at[gt]
        in: query
        schema:
          type: string
      - name: created_at[gte]
        in: query
        schema:
          type: string
      - name: created_at[lt]
        in: query
        schema:
          type: string
      - name: created_at[lte]
        in: query
        schema:
          type: string
      - name: user_guids
        in: query
        schema:
          type: string
      - name: show_deleted
        in: query
        schema:
          type: string
      - name: booked_by_user_uuid
        in: query
        schema:
          type: string
      - name: no_show
        in: query
        schema:
          type: string
      - name: meeting_type_id
        in: query
        schema:
          type: string
      - name: cadence_id
        in: query
        schema:
          type: string
      - name: step_id
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /meetings/{id}:
    put:
      tags:
      - Meetings
      summary: Salesloft Update a Meeting
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                no_show: true
                status: string
                reschedule_status: string
                event_id: string
                i_cal_uid: string
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
