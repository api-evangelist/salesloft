openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Person Stages API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Person Stages
  description: '[https://developer.salesloft.com/docs/api/person-stages/](https://developer.salesloft.com/docs/api/person-stages/)'
paths:
  /person_stages:
    get:
      tags:
      - Person Stages
      summary: Salesloft List Person Stages
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Person Stages
      summary: Salesloft Create a Person Stage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /person_stages/{id}:
    get:
      tags:
      - Person Stages
      summary: Salesloft Fetch a Person Stage
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
      - Person Stages
      summary: Salesloft Update a Person Stage
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: string
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - Person Stages
      summary: Salesloft Delete a Person Stage
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
