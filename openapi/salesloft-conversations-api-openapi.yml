openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Conversations API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Conversations
  description: '[https://developer.salesloft.com/docs/api/conversations/](https://developer.salesloft.com/docs/api/conversations/)'
paths:
  /conversations:
    get:
      tags:
      - Conversations
      summary: Salesloft Fetch Conversations
      security:
      - bearerAuth: []
      parameters:
      - name: title
        in: query
        schema:
          type: string
      - name: title[_starts_with]
        in: query
        schema:
          type: string
      - name: created_at[gt]
        in: query
        schema:
          type: string
      - name: created_at[gte]
        in: query
        schema:
          type: string
      - name: created_at[lt]
        in: query
        schema:
          type: string
      - name: created_at[lte]
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: duration[lt]
        in: query
        schema:
          type: string
      - name: duration[lte]
        in: query
        schema:
          type: string
      - name: duration[gt]
        in: query
        schema:
          type: string
      - name: duration[gte]
        in: query
        schema:
          type: string
      - name: language_code
        in: query
        schema:
          type: string
      - name: platform
        in: query
        schema:
          type: string
      - name: owner_ids
        in: query
        schema:
          type: string
      - name: user_guids
        in: query
        schema:
          type: string
      - name: ids
        in: query
        schema:
          type: string
      - name: account_ids
        in: query
        schema:
          type: string
      - name: person_ids
        in: query
        schema:
          type: string
      - name: is_api
        in: query
        schema:
          type: string
      - name: media_type
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /conversations/{id}:
    get:
      tags:
      - Conversations
      summary: Salesloft Fetch a Conversation
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /conversations/71d91aec-80bc-463b-b072-475aea744805/extensive:
    get:
      tags:
      - Conversations
      summary: Salesloft Fetch an Extensive Conversation
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /conversations/{id}/recording:
    get:
      tags:
      - Conversations
      summary: Salesloft Fetch Conversation Media
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
