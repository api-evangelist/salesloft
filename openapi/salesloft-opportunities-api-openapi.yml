        schema:
          type: string
      - name: created_at[gt]
        in: query
        schema:
          type: string
      - name: created_at[gte]
        in: query
        schema:
          type: string
      - name: created_at[lt]
        in: query
        schema:
          type: string
      - name: created_at[lte]
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: crm_id
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: tag_id
        in: query
        schema:
          type: string
      - name: account_crm_id
        in: query
        schema:
          type: string
      - name: account_id
        in: query
        schema:
          type: string
      - name: associated_account_id
        in: query
        schema:
          type: string
      - name: owner_crm_id
        in: query
        schema:
          type: string
      - name: opportunity_type
        in: query
        schema:
          type: string
      - name: owner_id
        in: query
        schema:
          type: string
      - name: name
        in: query
        schema:
          type: string
