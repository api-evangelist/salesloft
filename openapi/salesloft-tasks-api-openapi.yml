openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Tasks API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Tasks
  description: '[https://developer.salesloft.com/docs/api/tasks/](https://developer.salesloft.com/docs/api/tasks/)'
paths:
  /tasks:
    get:
      tags:
      - Tasks
      summary: Salesloft List Tasks
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: user_id
        in: query
        schema:
          type: string
      - name: person_id
        in: query
        schema:
          type: string
      - name: account_id
        in: query
        schema:
          type: string
      - name: current_state
        in: query
        schema:
          type: string
      - name: task_type
        in: query
        schema:
          type: string
      - name: time_interval_filter
        in: query
        schema:
          type: string
      - name: completed_time_interval
        in: query
        schema:
          type: string
      - name: idempotency_key
        in: query
        schema:
          type: string
      - name: locale
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: completed_at[gt]
        in: query
        schema:
          type: string
      - name: completed_at[gte]
        in: query
        schema:
          type: string
      - name: completed_at[lt]
        in: query
        schema:
          type: string
      - name: completed_at[lte]
        in: query
        schema:
          type: string
      - name: include_counts_acted_on[gt]
        in: query
        schema:
          type: string
      - name: include_counts_acted_on[gte]
        in: query
        schema:
          type: string
      - name: include_counts_acted_on[lt]
        in: query
        schema:
          type: string
      - name: include_counts_acted_on[lte]
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Tasks
      summary: Salesloft Create a Task
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                subject: string
                person_id: string
                user_id: 0
                user_guid: string
                task_type: string
                due_date: string
                remind_at: string
                idempotency_key: string
                description: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /tasks/265615502:
    put:
      tags:
      - Tasks
      summary: Salesloft Update a Task
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                subject: string
                person_id: string
                user_id: 0
                user_guid: string
                task_type: string
                due_date: string
                due_at: string
                current_state: string
                remind_at: string
                description: string
                is_logged: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /tasks/{id}:
    get:
      tags:
      - Tasks
      summary: Salesloft Fetch a Task
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
