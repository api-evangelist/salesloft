openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Email Missing Tags API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Email Missing Tags
  description: '[https://developer.salesloft.com/docs/api/email-missing-tags/](https://developer.salesloft.com/docs/api/email-missing-tags/)'
paths:
  /email_missing_tags:
    post:
      tags:
      - Email Missing Tags
      summary: Salesloft Requests a Check of the Template for Missed Tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                person_id: 0
                subject: string
                body: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
