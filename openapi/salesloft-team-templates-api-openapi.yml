openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Team Templates API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Team Templates
  description: '[https://developer.salesloft.com/docs/api/team-templates/](https://developer.salesloft.com/docs/api/team-templates/)'
paths:
  /team_templates:
    get:
      tags:
      - Team Templates
      summary: Salesloft List Team Templates
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: updated_at[gt]
        in: query
        schema:
          type: string
      - name: updated_at[gte]
        in: query
        schema:
          type: string
      - name: updated_at[lt]
        in: query
        schema:
          type: string
      - name: updated_at[lte]
        in: query
        schema:
          type: string
      - name: search
        in: query
        schema:
          type: string
      - name: tag_ids
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      - name: include_archived_templates
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Team Templates
      summary: Salesloft Create Team Email Template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: string
                subject: string
                body: string
                open_tracking: true
                click_tracking: true
                attachment_ids:
                - 0
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /team_templates/{id}:
    get:
      tags:
      - Team Templates
      summary: Salesloft Fetch a Team Template
      parameters:
      - name: include_signature
        in: query
        schema:
          type: string
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    put:
      tags:
      - Team Templates
      summary: Salesloft Update Team Email Template
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: string
                subject: string
                body: string
                open_tracking: true
                click_tracking: true
                attachment_ids:
                - 0
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
