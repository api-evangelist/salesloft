openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction Custom Fields API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Custom Fields
  description: '[https://developer.salesloft.com/docs/api/custom-fields/](https://developer.salesloft.com/docs/api/custom-fields/)'
paths:
  /custom_fields/{id}:
    get:
      tags:
      - Custom Fields
      summary: Salesloft Fetch a Custom Field
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    delete:
      tags:
      - Custom Fields
      summary: Salesloft Delete a Custom Field
      parameters:
      - name: id
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /custom_fields:
    get:
      tags:
      - Custom Fields
      summary: Salesloft List Custom Fields
      parameters:
      - name: ids
        in: query
        schema:
          type: string
      - name: field_type
        in: query
        schema:
          type: string
      - name: value_type
        in: query
        schema:
          type: string
      - name: sort_by
        in: query
        schema:
          type: string
      - name: sort_direction
        in: query
        schema:
          type: string
      - name: per_page
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: string
      - name: include_paging_counts
        in: query
        schema:
          type: string
      - name: limit_paging_counts
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
    post:
      tags:
      - Custom Fields
      summary: Salesloft Create a Custom Field
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                name: string
                field_type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
