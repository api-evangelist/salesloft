openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: Account and People Redaction
  description: '[https://developer.salesloft.com/docs/api/account-and-people-redaction/](https://developer.salesloft.com/docs/api/account-and-people-redaction/)'
paths:
  /data_control/account_and_people_redaction:
    post:
      tags:
      - Account and People Redaction
      summary: Salesloft Submit an Account and People Redaction Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                team_id: 0
                schedule: {}
                dry_run: true
                account_id: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
