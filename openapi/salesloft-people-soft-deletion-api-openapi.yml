openapi: 3.0.0
info:
  title: Salesloft Account and People Redaction People Soft Deletion API
  description: This data allows integration owners to self-serve and claim more ownership over API usage, especially when using the Signals API to integrate with Rhythm. This ...
  version: 1.0.0
servers:
- url: http://{{salesloft_api_base_url}}
- url: https://accounts.salesloft.com
- url: http://{{salesloft_api_base_url}}external
security:
- oauth2Auth: []
tags:
- name: People Soft Deletion
  description: '[https://developer.salesloft.com/docs/api/people-soft-deletion/](https://developer.salesloft.com/docs/api/people-soft-deletion/)'
paths:
  /data_control/people_soft_deletion:
    post:
      tags:
      - People Soft Deletion
      summary: Salesloft Submit a People Soft Deletion Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                team_id: 0
                schedule: {}
                people_ids:
                - null
                dry_run: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
components:
  securitySchemes:
    noauthAuth:
      type: http
      scheme: noauth
    bearerAuth:
      type: http
      scheme: bearer
    oauth2Auth:
      type: http
      scheme: oauth2
