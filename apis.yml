aid: salesloft
url: https://raw.githubusercontent.com/api-evangelist/salesloft/refs/heads/main/apis.yml
name: Salesloft
kind: company
description: Salesloft is a sales engagement and revenue orchestration platform, now combined with Clari, Drift and Groove,
  used by more than 4,000 sales teams to run cadences, dial and email prospects, capture and analyse conversations, and forecast
  pipeline. The Salesloft Platform API v2 at https://api.salesloft.com/v2 covers accounts, people, cadences, steps and actions,
  tasks, calls, emails, meetings, notes, opportunities, conversation intelligence, bulk jobs, imports, CRM mirroring, data-redaction
  governance and Rhythm signals, authenticated with OAuth 2.0 (authorization code and client credentials) or scoped API keys
  and priced against a 600-cost-per-minute per-team budget. Salesloft also publishes a documented webhook surface with HMAC-signed
  deliveries and a first-party remote MCP server at https://mcp.salesloft.com/mcp exposing fifteen read-only tools to AI agents.
accessModel:
  pricing: unknown
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Self-serve signup
  confidence: high
