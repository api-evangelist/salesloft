- aid: salesloft:salesloft-client-credentials-access-token-api
  name: Salesloft Client Credentials Access Token API
  description: >-
    If you are building a private OAuth app, it's likely easier to use Client Credentials rather than
    OAuth2.0 refresh tokens. Use the request in this folder to retreive an access_token for your private
    OAuth app using client credentials. The request includes a Postman script to add the returned access_token
    as a variable in the collection. To use this token in subsequent requests, adjust the authorization
    of the request to Bearer Token and add {{client_credentials_token}} in the token field.
