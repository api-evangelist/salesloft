    install: gem install omniauth-salesloft
    official: true
    kind: auth-strategy
    version: 1.0.0
    published: '2017-06-09'
    note: >-
      Published by "SalesLoft Engineering". An OmniAuth strategy for the SalesLoft Public
      API — it implements the OAuth 2.0 authorization-code handshake only and wraps no API
      operations, so it is NOT an API client SDK. Last release 2017-06-09, nine years before
      the v2 API surface catalogued in openapi/. 96,014 downloads.
