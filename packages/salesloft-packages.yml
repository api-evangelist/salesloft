source: >-
  npm registry search + registry.npmjs.org metadata, pypi.org/pypi JSON, rubygems.org
  API v1, and the github.com/SalesLoft organization listing (55 repositories, GitHub API).
description: >-
  Salesloft publishes NO first-party API client SDK in any language. The developer docs
  (developers.salesloft.com) point at raw HTTP, a public Postman workspace, and example
  repositories — not at a maintained client library. The only first-party package on a
  public registry is an OmniAuth strategy (Ruby) that handles the OAuth handshake, not the
  API surface, and its latest release is from 2017. Everything else that carries the
  Salesloft name on npm, PyPI or RubyGems is third-party and stale. This is recorded as a
  finding, not a gap in the search: every registry below answered.
official_sdk_count: 0

