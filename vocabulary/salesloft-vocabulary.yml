method: generated
vocabulary:
  title: Salesloft API Vocabulary
  description: >-
    Vocabulary and taxonomy for the Salesloft Revenue Orchestration Platform API,
    covering key concepts, entities, and operational terminology.
  version: '1.0'
  created: '2026-05-02'
  provider: Salesloft

terms:

  # Core Entities
  - term: Account
    definition: >-
      A company or organization tracked in Salesloft. Accounts represent target
      companies in the sales process and can be associated with multiple People,
      Cadences, and Opportunities.
    related: [Person, Opportunity, CRM]
    tags: [Entity, Sales]

  - term: Person
    definition: >-
      An individual contact or prospect being engaged through the sales process.
      People are associated with Accounts and can be enrolled in Cadences.
    related: [Account, Cadence, CRM]
    tags: [Entity, Sales]

  - term: Cadence
    definition: >-
      A structured sequence of sales touchpoints (calls, emails, tasks, LinkedIn)
      designed to engage a prospect. Cadences automate outreach workflows and
      track engagement signals.
    related: [Step, CadenceMembership, Signal]
    tags: [Entity, Automation, Workflow]

  - term: CadenceMembership
    definition: >-
      The association between a Person and a Cadence, indicating that the person
      is enrolled in that cadence and will receive its steps.
    related: [Cadence, Person, Step]
    tags: [Entity, Workflow]

  - term: Step
    definition: >-
      A single touchpoint action within a Cadence, such as a phone call, email,
      LinkedIn message, or custom task. Steps have a scheduled day and action type.
    related: [Cadence, Action, Task]
    tags: [Entity, Workflow]

  - term: Action
    definition: >-
      A pending task for a sales rep generated by a Cadence Step. Actions appear
      in the rep's workflow queue and track whether tasks are completed.
    related: [Step, Task, Cadence]
    tags: [Entity, Workflow]

  - term: Task
    definition: >-
      A manual to-do item for a sales rep, either cadence-driven or created
      independently. Tasks have due dates and can be associated with People and Accounts.
    related: [Action, Person, Account]
    tags: [Entity, Sales]

  - term: Opportunity
    definition: >-
      A potential deal or sale tracked in Salesloft. Opportunities can be synced
      from a CRM and are associated with Accounts and People.
    related: [Account, Person, CRM, OpportunityStage]
    tags: [Entity, Sales]

  - term: OpportunityStage
    definition: >-
      A stage in the sales funnel that an Opportunity can be assigned to,
      representing progress toward closing a deal.
    related: [Opportunity]
    tags: [Entity, Sales]

  - term: Call
    definition: >-
      A recorded phone call made through the Salesloft Dialer. Call records include
      duration, recording URL, disposition, and sentiment.
    related: [CallDisposition, CallSentiment, Person]
    tags: [Entity, Communication]

  - term: CallDisposition
    definition: >-
      A customizable outcome label for a call, such as "Connected", "Voicemail",
      or "No Answer". Used to classify call results.
    related: [Call]
    tags: [Taxonomy, Communication]

  - term: CallSentiment
    definition: >-
      A label representing the emotional tone or quality of a call, such as
      "Positive", "Neutral", or "Negative".
    related: [Call]
    tags: [Taxonomy, Communication]

  - term: Email
    definition: >-
      An email message sent through Salesloft to a prospect, either manually
      or as part of a Cadence step. Tracked for opens, clicks, and replies.
    related: [EmailTemplate, Person, Cadence]
    tags: [Entity, Communication]

  - term: EmailTemplate
    definition: >-
      A reusable email template with variable placeholders (merge fields) that
      can be used in Cadence steps or manual outreach.
    related: [Email, Cadence]
    tags: [Entity, Communication]

  - term: Signal
    definition: >-
      An event or intent indicator from a prospect or account, captured via the
      Signals API and surfaced in the Rhythm workflow to trigger prioritized actions.
    related: [Cadence, Action, Rhythm]
    tags: [Entity, AI, Intelligence]

  - term: SignalRegistration
    definition: >-
      A registered signal source that feeds intent data into Salesloft Rhythm,
      defining how external signals map to in-platform actions.
    related: [Signal, Rhythm]
    tags: [Entity, Integration, AI]

  - term: Transcription
    definition: >-
      An AI-generated text transcription of a recorded call, including speaker
      attribution, sentences, and key topic identification.
    related: [Call, ConversationIntelligence]
    tags: [Entity, AI, Communication]

  - term: User
    definition: >-
      A Salesloft platform user (sales rep, manager, or admin). Users own
      Accounts, People, Cadences, and Actions.
    related: [Team, Group, Profile]
    tags: [Entity, Identity]

  - term: Team
    definition: >-
      The entire Salesloft team/organization instance. Team settings apply
      globally across all users.
    related: [User, Group]
    tags: [Entity, Identity]

  - term: Group
    definition: >-
      A sub-group of Users within a Salesloft Team, typically representing
      a sales team, region, or pod.
    related: [User, Team]
    tags: [Entity, Identity]

  - term: WebhookSubscription
    definition: >-
      A registered endpoint that Salesloft will call when specific platform
      events occur, enabling real-time integrations.
    related: [Event, Integration]
    tags: [Entity, Integration]

  # Functional Concepts
  - term: Rhythm
    definition: >-
      Salesloft's AI-powered workflow engine that prioritizes sales rep actions
      based on buyer signals, engagement data, and deal context.
    related: [Signal, Action, Cadence]
    tags: [Product, AI, Workflow]

  - term: ConversationIntelligence
    definition: >-
      AI-powered analysis of call recordings and meetings to extract insights,
      coaching opportunities, and deal intelligence from conversations.
    related: [Transcription, Call, Meeting]
    tags: [Product, AI, Intelligence]

  - term: RevenueOrchestration
    definition: >-
      Salesloft's platform philosophy of coordinating all revenue-generating activities
      across the full customer lifecycle through AI-driven guidance.
    related: [Cadence, Signal, Rhythm]
    tags: [Concept, Platform]

  - term: Upsert
    definition: >-
      An API operation that creates a record if it does not exist or updates it
      if it does, typically matched on email address or CRM ID.
    related: [Account, Person]
    tags: [Operation, Integration]

  - term: BulkJob
    definition: >-
      A large-scale async operation for importing or modifying many records at once.
      Bulk Jobs are submitted, processed, and results retrieved asynchronously.
    related: [Person, Account, Import]
    tags: [Operation, Async]

  - term: CRMActivity
    definition: >-
      An activity record (call, email, meeting) logged to an external CRM system
      such as Salesforce, synced bidirectionally from Salesloft.
    related: [Call, Email, Meeting, CRM]
    tags: [Entity, Integration]

  - term: Redaction
    definition: >-
      The process of permanently removing personal data for an Account or Person
      to comply with data privacy regulations such as GDPR or CCPA.
    related: [Account, Person, Compliance]
    tags: [Compliance, Operation]

  - term: RightToBeForgotten
    definition: >-
      A GDPR compliance request to permanently delete all data associated with
      a specific individual from Salesloft.
    related: [Redaction, Person, Compliance]
    tags: [Compliance, Operation]

  # Authentication / API Concepts
  - term: OAuth2
    definition: >-
      The primary authentication protocol for Salesloft API integrations. Uses
      Authorization Code flow for third-party apps, Client Credentials for private apps.
    related: [BearerToken, ClientCredentials]
    tags: [Authentication, Security]

  - term: BearerToken
    definition: >-
      An OAuth2 access token passed in the Authorization header to authenticate
      Salesloft API requests.
    related: [OAuth2]
    tags: [Authentication, Security]

  - term: PersonalAPIKey
    definition: >-
      A long-lived API key generated in the Salesloft settings for testing and
      personal automation. Used as a Bearer token.
    related: [OAuth2, BearerToken]
    tags: [Authentication, Security]
